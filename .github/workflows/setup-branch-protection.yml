name: Setup Branch Protection

on:
  workflow_dispatch:
    inputs:
      ci_job_name:
        description: 'The exact name of the CI job to require'
        required: true
        default: 'validate'
      admin_token:
        description: 'GitHub Personal Access Token (PAT) with Repo Admin privileges (Leave empty to use GITHUB_TOKEN/secrets.ADMIN_GITHUB_TOKEN)'
        required: false
        type: string

jobs:
  configure-protection:
    name: Apply Branch Protection
    runs-on: ubuntu-latest
    steps:
      - name: Setup Branch Protection Rules
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_TOKEN: ${{ inputs.admin_token }}
          ADMIN_SECRET_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          # Resolve which token to use
          API_TOKEN=""
          if [ -n "$CUSTOM_TOKEN" ]; then
            API_TOKEN="$CUSTOM_TOKEN"
          elif [ -n "$ADMIN_SECRET_TOKEN" ]; then
            API_TOKEN="$ADMIN_SECRET_TOKEN"
          else
            API_TOKEN="$GH_TOKEN"
          fi
          
          # Export for gh command
          export GH_TOKEN="$API_TOKEN"
          
          echo "Setting up branch protection rules for main, staging, and develop..."
          
          # 1. Main Branch Protection
          # - Require Pull Request
          # - Require 1 approving review
          # - Require CI Status Check
          # - Block Force Push (allow_force_pushes: false)
          echo "Protecting 'main' branch..."
          gh api --method PUT /repos/${{ github.repository }}/branches/main/protection \
            --headers "Accept: application/vnd.github+json" \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["${{ inputs.ci_job_name }}"]
            },
            "enforce_admins": null,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": true,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true
          }
          EOF
          
          # 2. Staging Branch Protection
          # - Require Pull Request (1 approval)
          # - Require CI Status Check
          echo "Protecting 'staging' branch..."
          gh api --method PUT /repos/${{ github.repository }}/branches/staging/protection \
            --headers "Accept: application/vnd.github+json" \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["${{ inputs.ci_job_name }}"]
            },
            "enforce_admins": null,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true
          }
          EOF
          
          # 3. Develop Branch Protection
          # - Require Pull Request (1 approval)
          # - Require CI Status Check
          echo "Protecting 'develop' branch..."
          gh api --method PUT /repos/${{ github.repository }}/branches/develop/protection \
            --headers "Accept: application/vnd.github+json" \
            --input - <<EOF
          {
            "required_status_checks": {
              "strict": true,
              "contexts": ["${{ inputs.ci_job_name }}"]
            },
            "enforce_admins": null,
            "required_pull_request_reviews": {
              "dismiss_stale_reviews": true,
              "require_code_owner_reviews": false,
              "required_approving_review_count": 1
            },
            "restrictions": null,
            "allow_force_pushes": false,
            "allow_deletions": false,
            "required_conversation_resolution": true
          }
          EOF
          
          echo "Branch protection setup complete!"
